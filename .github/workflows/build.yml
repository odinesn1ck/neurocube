name: Build and test NeuroCube
on:
  push:
    branches: [main, codex/neurocube-mvp]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned user-local toolchain
        shell: pwsh
        run: ./tools/bootstrap.ps1
      - name: Documentation links
        shell: pwsh
        run: |
          & "$env:USERPROFILE/neurocube-tools/venv/Scripts/python.exe" docs/tools/check_docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native tests and simulator
        shell: pwsh
        run: |
          $python = "$env:USERPROFILE/neurocube-tools/venv/Scripts/python.exe"
          & $python tools/neurocube.py build --native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build-native/neurocube_sim.exe --headless build-native/menu.ppm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Simulator gallery
        shell: pwsh
        run: |
          ./build-native/neurocube_sim.exe --gallery artifacts/gallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build RP2350 firmware
        shell: pwsh
        run: |
          & "$env:USERPROFILE/neurocube-tools/venv/Scripts/python.exe" tools/neurocube.py build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash build-pico/neurocube.uf2 -Algorithm SHA256 | Format-List | Out-File build-pico/SHA256.txt
      - name: Prepare reproducible release candidate (no publishing)
        shell: pwsh
        run: |
          & "$env:USERPROFILE/neurocube-tools/venv/Scripts/python.exe" tools/prepare_release.py --verify-reproducible
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neurocube-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            build-pico/neurocube.uf2
            build-pico/neurocube.elf
            build-pico/neurocube.bin
            build-pico/SHA256.txt
            build-native/neurocube_sim.exe
            build-native/core_tests.exe
            build-native/menu.ppm
            artifacts/release-1.0.0/dist/*
            build-native/Testing/Temporary/LastTest.log
